<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxímetro - Monitor Remoto</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; }
        .metrics { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px; }
        .val { font-weight: bold; color: #00e676; }
        canvas { width: 100%; height: 250px; background-color: #000; border-radius: 8px; }
        button { background-color: #00c853; color: white; border: none; padding: 12px 20px; font-size: 1rem; border-radius: 5px; width: 100%; margin-top: 10px; cursor: pointer; }
        button:disabled { background-color: #555; cursor: default; }
        .status { margin-top: 10px; font-size: 0.9rem; color: #aaa; }
        .aviso { color: #ffb300; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel do Oxímetro (Remoto)</h2>
        <div class="metrics">
            <div>SpO₂: <span id="spo2Val" class="val">-- %</span></div>
            <div>Razão (R): <span id="rVal" class="val">--</span></div>
        </div>
        <button id="btnDownload" disabled>Baixar Relatório (.CSV)</button>
        <div id="lblStatus" class="status">Status: Desconectado</div>
        <div id="lblUltimo" class="status"></div>
    </div>

    <div class="card">
        <canvas id="osciloscopeCanvas"></canvas>
    </div>

    <script>
        // ====== CONFIGURAÇÃO ======
        // Troque pela URL do seu relay publicado (wss:// obrigatório em páginas HTTPS).
        const RELAY_URL = 'wss://oximetro-relay.onrender.com/?role=viewer';
        const RECONNECT_MIN_MS = 1000;
        const RECONNECT_MAX_MS = 15000;
        const SEM_DADOS_LIMITE_MS = 10000; // aviso se o celular parar de enviar

        const lblStatus = document.getElementById('lblStatus');
        const lblUltimo = document.getElementById('lblUltimo');
        const btnDownload = document.getElementById('btnDownload');
        const spo2Val = document.getElementById('spo2Val');
        const rVal = document.getElementById('rVal');
        const canvas = document.getElementById('osciloscopeCanvas');
        const ctx = canvas.getContext('2d');

        let csvRows = ["Tempo_ms,Canal,Val_Raw,Val_Filtrado,SpO2,R\n"];
        let dataBuffer = [];
        const maxPoints = 500;
        let incomingBuffer = "";

        let ws = null;
        let reconnectDelay = RECONNECT_MIN_MS;
        let reconnectTimer = null;
        let lastDataAt = 0;

        // --- Ajuste do canvas ao tamanho da tela ---
        function ajustarCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawOscilloscope();
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        // --- CONEXÃO COM O RELAY (internet) ---
        function conectarRelay() {
            clearTimeout(reconnectTimer);
            if (ws) {
                ws.onclose = null;
                ws.onerror = null;
                ws.close();
            }

            lblStatus.innerText = "Status: Conectando ao servidor...";
            incomingBuffer = "";
            ws = new WebSocket(RELAY_URL);

            ws.onopen = () => {
                reconnectDelay = RECONNECT_MIN_MS;
                lblStatus.innerText = "Status: Conectado ao servidor";
                btnDownload.disabled = false;
            };

            ws.onmessage = (e) => {
                lastDataAt = Date.now();
                handleChunk(e.data);
            };

            ws.onclose = () => {
                lblStatus.innerText = "Status: Servidor desconectado. Nova tentativa em " +
                    Math.round(reconnectDelay / 1000) + " s";
                reconnectTimer = setTimeout(conectarRelay, reconnectDelay);
                reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
            };

            ws.onerror = () => ws.close();
        }

        // Atualiza o aviso de "sem dados" a cada segundo
        setInterval(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                lblUltimo.innerText = "";
                lblUltimo.classList.remove('aviso');
                return;
            }
            if (lastDataAt === 0) {
                lblUltimo.innerText = "Aguardando dados do celular...";
                lblUltimo.classList.add('aviso');
            } else if (Date.now() - lastDataAt > SEM_DADOS_LIMITE_MS) {
                lblUltimo.innerText = "Sem dados do celular há mais de " +
                    Math.round(SEM_DADOS_LIMITE_MS / 1000) + " s";
                lblUltimo.classList.add('aviso');
            } else {
                lblUltimo.innerText = "Recebendo dados ao vivo";
                lblUltimo.classList.remove('aviso');
            }
        }, 1000);

        // --- PROCESSAMENTO DOS DADOS (igual ao original) ---
        function handleChunk(value) {
            incomingBuffer += value;
            let lines = incomingBuffer.split("\n");
            incomingBuffer = lines.pop();

            let houveGrafico = false;
            for (let line of lines) {
                if (processLine(line.trim())) houveGrafico = true;
            }
            if (houveGrafico) drawOscilloscope();
        }

        // Retorna true quando adiciona um ponto ao gráfico
        function processLine(line) {
            if (!line) return false;
            csvRows.push(line + "\n");

            let parts = line.split(",");
            if (parts.length !== 6) return false;

            let canal = parts[1];
            let valFilt = parseFloat(parts[3]);
            let spo2 = parseFloat(parts[4]);
            let r = parseFloat(parts[5]);

            if (canal === 'CALC') {
                if (spo2 > 0) {
                    spo2Val.innerText = spo2.toFixed(1) + " %";
                    rVal.innerText = r.toFixed(3);
                }
                return false;
            }

            if (canal.includes('RED') || canal.includes('IR')) {
                dataBuffer.push({ val: valFilt, isRed: canal.includes('RED') });
                if (dataBuffer.length > maxPoints) dataBuffer.shift();
                return true;
            }
            return false;
        }

        function drawOscilloscope() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (dataBuffer.length < 2) return;

            ctx.lineWidth = 2;
            let min = Infinity, max = -Infinity;
            for (const d of dataBuffer) {
                if (d.val < min) min = d.val;
                if (d.val > max) max = d.val;
            }
            let range = (max - min) || 1;

            for (let i = 1; i < dataBuffer.length; i++) {
                let x0 = ((i - 1) / maxPoints) * canvas.width;
                let y0 = canvas.height - ((dataBuffer[i - 1].val - min) / range) * (canvas.height - 20) - 10;
                let x1 = (i / maxPoints) * canvas.width;
                let y1 = canvas.height - ((dataBuffer[i].val - min) / range) * (canvas.height - 20) - 10;

                ctx.beginPath();
                ctx.strokeStyle = dataBuffer[i].isRed ? "#ff1744" : "#29b6f6";
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }
        }

        // --- DOWNLOAD DO CSV (igual ao original) ---
        btnDownload.addEventListener('click', () => {
            const blob = new Blob(csvRows, { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `oximetria_dados_${Date.now()}.csv`);
            a.click();
            setTimeout(() => window.URL.revokeObjectURL(url), 1000);
        });

        // Inicia a conexão automaticamente ao abrir a página
        conectarRelay();
    </script>
</body>
</html>
